<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="980" fill="url(#paperWash)"/>
  <g opacity="0.14">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200M0 1200H1200M0 1320H1200" stroke="#2C3442"/>
    <path d="M120 0V980M240 0V980M360 0V980M480 0V980M600 0V980M720 0V980M840 0V980M960 0V980M1080 0V980" stroke="#2C3442"/>
  </g>
  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 01 · PROBLEM</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">文档约束为什么总在执行时失效</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">看起来规则很多，真正缺的是流程里那道拦住 Agent 的门。</tspan></text>
  
        <rect x="58" y="290" width="324" height="248" rx="22" fill="#151922" stroke="#8E744A" stroke-width="2.1" opacity="1"/>
    <text x="82" y="340" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">规则很多</tspan></text>
    <text x="82" y="382" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">规则入口、workflow、skills、</tspan><tspan x="82" dy="26">toolset 都已经存在。</tspan></text>
        <rect x="438" y="290" width="324" height="248" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="462" y="340" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="462" dy="0">Agent 继续往前跑</tspan></text>
    <text x="462" y="382" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="462" dy="0">跳过环境前置、工具选型或反思，</tspan><tspan x="462" dy="26">仍能产出“已完成”的结果。</tspan></text>
        <rect x="818" y="290" width="324" height="248" rx="22" fill="#151922" stroke="#D4B06A" stroke-width="2.1" opacity="1"/>
    <text x="842" y="340" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="842" dy="0">没人真正拦它</tspan></text>
    <text x="842" y="382" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="842" dy="0">文档告诉它应该做什么，但流程里</tspan><tspan x="842" dy="26">没有阻断机制。</tspan></text>
        <path d="M 358 410 L 450 410 M 441.33974596215563 415 L 450 410 L 441.33974596215563 405" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 750 410 L 842 410 M 833.3397459621556 415 L 842 410 L 833.3397459621556 405" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

        <rect x="58" y="614" width="1084" height="280" rx="26" fill="rgba(21,25,34,0.92)" stroke="#2E3746" stroke-width="2" opacity="1"/>
        <text x="86" y="654" fill="#F5F1E8" font-size="30" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="86" dy="0">三个结构性断点</tspan></text>
        <rect x="86" y="706" width="318" height="146" rx="22" fill="#151922" stroke="#8E744A" stroke-width="2.1" opacity="1"/>
    <text x="110" y="756" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">状态不落盘</tspan></text>
    <text x="110" y="798" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">进度只活在聊天上下文里，一中</tspan><tspan x="110" dy="26">断就丢。</tspan></text>
        <rect x="442" y="706" width="318" height="146" rx="22" fill="#151922" stroke="#D4B06A" stroke-width="2.1" opacity="1"/>
    <text x="466" y="756" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="466" dy="0">中断不可恢复</tspan></text>
    <text x="466" y="798" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="466" dy="0">恢复靠猜，不靠确定的状态文件</tspan><tspan x="466" dy="26">。</tspan></text>
        <rect x="798" y="706" width="318" height="146" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="822" y="756" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="822" dy="0">无阻止机制</tspan></text>
    <text x="822" y="798" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="822" dy="0">没做前置也能继续往后写。</tspan></text>
      
</svg>