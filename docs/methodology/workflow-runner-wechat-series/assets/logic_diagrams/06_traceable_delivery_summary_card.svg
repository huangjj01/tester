  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 06 · SUMMARY</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">真正的问题不是 Agent 会不会写</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">而是团队能不能验证它交付了什么</tspan></text>
  
        <rect x="120" y="246" width="960" height="356" rx="32" fill="rgba(17,22,30,0.96)" stroke="#6D7C57" stroke-width="2.4" opacity="1"/>
        <text x="600" y="346" fill="#F5F1E8" font-size="42" font-weight="920" text-anchor="middle" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="600" dy="0">真正的问题不是 Agent 会不会写，</tspan></text>
        <text x="600" y="426" fill="#E8D8B7" font-size="42" font-weight="920" text-anchor="middle" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="600" dy="0">而是团队能不能验证它交付了什么。</tspan></text>
        <text x="600" y="516" fill="#CFC5B4" font-size="24" font-weight="760" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="600" dy="0">Workflow Runner 的价值，不在把 Agent 管死，而在把执行过程从</tspan><tspan x="600" dy="34">黑箱变成可检查、可恢复、可追溯的白箱。</tspan></text>
      
</svg>