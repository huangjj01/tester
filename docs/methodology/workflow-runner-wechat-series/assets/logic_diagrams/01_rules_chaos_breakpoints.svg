<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920">
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="920" fill="url(#paperWash)"/>
  <g opacity="0.14">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200M0 1200H1200M0 1320H1200" stroke="#2C3442"/>
    <path d="M120 0V920M240 0V920M360 0V920M480 0V920M600 0V920M720 0V920M840 0V920M960 0V920M1080 0V920" stroke="#2C3442"/>
  </g>
  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 01 · BREAKPOINTS</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">三个结构性断点</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">真正让规则在执行时失效的，不是文档数量不够，而是这三类断裂一直存在。</tspan></text>
  
        <rect x="58" y="270" width="1084" height="540" rx="28" fill="rgba(21,25,34,0.94)" stroke="#394356" stroke-width="2.2" opacity="1"/>
        <rect x="94" y="334" width="316" height="200" rx="22" fill="#151922" stroke="#8E744A" stroke-width="2.1" opacity="1"/>
    <text x="118" y="384" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="118" dy="0">状态不落盘</tspan></text>
    <text x="118" y="426" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="118" dy="0">执行进度只活在聊天上下文里。</tspan><tspan x="118" dy="26">只要 compact、切会话、隔天继</tspan><tspan x="118" dy="26">续，之前走到哪一步就容易丢。</tspan></text>
        <rect x="442" y="334" width="316" height="200" rx="22" fill="#151922" stroke="#D4B06A" stroke-width="2.1" opacity="1"/>
    <text x="466" y="384" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="466" dy="0">中断不可恢复</tspan></text>
    <text x="466" y="426" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="466" dy="0">恢复时只能重新读文档、重新猜</tspan><tspan x="466" dy="26">进度。文档里没有“当前状态”</tspan><tspan x="466" dy="26">，只有“应该怎么做”。</tspan></text>
        <rect x="790" y="334" width="316" height="200" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="814" y="384" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="814" dy="0">无阻止机制</tspan></text>
    <text x="814" y="426" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="814" dy="0">文档能写“必须先做 A 再做 B”</tspan><tspan x="814" dy="26">，但如果 Agent 直接做了 B，没</tspan><tspan x="814" dy="26">有任何东西把它挡回去。</tspan></text>
        <path d="M 252 534 L 252 594 M 247 585.3397459621556 L 252 594 L 257 585.3397459621556" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 600 534 L 600 594 M 595 585.3397459621556 L 600 594 L 605 585.3397459621556" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 948 534 L 948 594 M 943 585.3397459621556 L 948 594 L 953 585.3397459621556" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="170" y="620" width="860" height="126" rx="24" fill="rgba(17,22,30,0.96)" stroke="#A54E3D" stroke-width="2" opacity="1"/>
        <text x="200" y="676" fill="#F5F1E8" font-size="28" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="200" dy="0">共同结果</tspan></text>
        <text x="200" y="724" fill="#CFC5B4" font-size="27" font-weight="760" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="200" dy="0">Agent 可以跳过前置、漏掉证据、带着空壳结果继续往前走，而</tspan><tspan x="200" dy="38">且看起来像“已经完成了”。</tspan></text>
      
</svg>