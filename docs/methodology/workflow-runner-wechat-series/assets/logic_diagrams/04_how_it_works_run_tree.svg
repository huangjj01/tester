  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 04 · RUN STRUCTURE</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">run 目录里实际落了什么</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">不把进度藏在聊天里，而是把当前状态、步骤状态和产物文件全都放进一个可检查的目录。</tspan></text>
  
        <rect x="100" y="282" width="1000" height="600" rx="28" fill="rgba(16,20,27,0.95)" stroke="#394356" stroke-width="2.2" opacity="1"/>
        <text x="140" y="348" fill="#F5F1E8" font-size="30" font-weight="900" text-anchor="start" font-family="Menlo, Monaco, Consolas, monospace" letter-spacing="0"><tspan x="140" dy="0">.runs/test_execution-20260612-xxxxxx/</tspan></text>
