<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="980" fill="url(#paperWash)"/>
  <g opacity="0.14">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200M0 1200H1200M0 1320H1200" stroke="#2C3442"/>
    <path d="M120 0V980M240 0V980M360 0V980M480 0V980M600 0V980M720 0V980M840 0V980M960 0V980M1080 0V980" stroke="#2C3442"/>
  </g>
  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 06 · VALUE</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">不是更严，而是更可验证</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">做完这一轮之后，真正留下来的不是工具名字，而是治理方向。</tspan></text>
  
        <rect x="58" y="310" width="250" height="220" rx="22" fill="#151922" stroke="#8E744A" stroke-width="2.1" opacity="1"/>
    <text x="82" y="360" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">可追溯</tspan></text>
    <text x="82" y="402" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">每次 run 都有独立目录</tspan><tspan x="82" dy="26">、状态文件和产物文件</tspan><tspan x="82" dy="26">。</tspan></text>
        <rect x="340" y="310" width="250" height="220" rx="22" fill="#151922" stroke="#5C8D89" stroke-width="2.1" opacity="1"/>
    <text x="364" y="360" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="364" dy="0">可恢复</tspan></text>
    <text x="364" y="402" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="364" dy="0">中断之后不靠记忆，直</tspan><tspan x="364" dy="26">接从状态继续。</tspan></text>
        <rect x="622" y="310" width="250" height="220" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="646" y="360" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="646" dy="0">可阻断</tspan></text>
    <text x="646" y="402" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="646" dy="0">关键前置不满足，流程</tspan><tspan x="646" dy="26">真的走不下去。</tspan></text>
        <rect x="904" y="310" width="238" height="220" rx="22" fill="#151922" stroke="#6D7C57" stroke-width="2.1" opacity="1"/>
    <text x="928" y="360" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="928" dy="0">可沉淀</tspan></text>
    <text x="928" y="402" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="928" dy="0">每次反思都把规则、工</tspan><tspan x="928" dy="26">具和流程往前推一点。</tspan></text>
        <rect x="58" y="620" width="1084" height="220" rx="26" fill="rgba(21,25,34,0.92)" stroke="#2E3746" stroke-width="2" opacity="1"/>
        <text x="86" y="688" fill="#F5F1E8" font-size="30" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="86" dy="0">根本问题</tspan></text>
        <text x="86" y="750" fill="#CFC5B4" font-size="27" font-weight="760" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="86" dy="0">Agent 时代的核心矛盾，不是它会不会写，而是团队能不能验证它交付了什么。Wo</tspan><tspan x="86" dy="38">rkflow Runner 解决的不是全部问题，但它把测试实施这一个切片从黑箱拉成了白</tspan><tspan x="86" dy="38">箱。</tspan></text>
      
</svg>