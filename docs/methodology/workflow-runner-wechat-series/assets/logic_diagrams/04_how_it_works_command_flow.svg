<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="980" fill="url(#paperWash)"/>
  <g opacity="0.14">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200M0 1200H1200M0 1320H1200" stroke="#2C3442"/>
    <path d="M120 0V980M240 0V980M360 0V980M480 0V980M600 0V980M720 0V980M840 0V980M960 0V980M1080 0V980" stroke="#2C3442"/>
  </g>
  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 04 · COMMAND FLOW</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">start → next → complete → valida</tspan><tspan x="58" dy="64">te</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">命令序列本身很轻，但它把状态推进和门禁校验串成了一个确定流程。</tspan></text>
  
        <rect x="58" y="312" width="232" height="132" rx="22" fill="#151922" stroke="#8E744A" stroke-width="2.1" opacity="1"/>
    <text x="82" y="362" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">start</tspan></text>
    <text x="82" y="404" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">创建 run，拷贝 work</tspan><tspan x="82" dy="26">flow 配置，初始化步</tspan><tspan x="82" dy="26">骤状态。</tspan></text>
        <rect x="340" y="312" width="232" height="132" rx="22" fill="#151922" stroke="#5C8D89" stroke-width="2.1" opacity="1"/>
    <text x="364" y="362" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="364" dy="0">next</tspan></text>
    <text x="364" y="404" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="364" dy="0">告诉 Agent 当前该做</tspan><tspan x="364" dy="26">哪一步，以及该补什</tspan><tspan x="364" dy="26">么产物。</tspan></text>
        <rect x="622" y="312" width="232" height="132" rx="22" fill="#151922" stroke="#D4B06A" stroke-width="2.1" opacity="1"/>
    <text x="646" y="362" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="646" dy="0">complete</tspan></text>
    <text x="646" y="404" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="646" dy="0">提交当前步骤，触发</tspan><tspan x="646" dy="26">依赖和内容校验。</tspan></text>
        <rect x="904" y="312" width="238" height="132" rx="22" fill="#151922" stroke="#6D7C57" stroke-width="2.1" opacity="1"/>
    <text x="928" y="362" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="928" dy="0">validate</tspan></text>
    <text x="928" y="404" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="928" dy="0">检查目标产物是否已达</tspan><tspan x="928" dy="26">成，决定能否收尾。</tspan></text>
        <path d="M 290 378 L 340 378 M 331.33974596215563 383 L 340 378 L 331.33974596215563 373" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 572 378 L 622 378 M 613.3397459621556 383 L 622 378 L 613.3397459621556 373" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 854 378 L 904 378 M 895.3397459621556 383 L 904 378 L 895.3397459621556 373" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

        <rect x="58" y="532" width="1084" height="330" rx="26" fill="rgba(21,25,34,0.92)" stroke="#2E3746" stroke-width="2" opacity="1"/>
        <rect x="86" y="588" width="464" height="108" rx="22" fill="#151922" stroke="#4FA36B" stroke-width="2.1" opacity="1"/>
    <text x="110" y="638" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">校验通过</tspan></text>
    <text x="110" y="680" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">步骤标记 completed，状态推进；下一次 next 会</tspan><tspan x="110" dy="26">返回新的当前步骤。</tspan></text>
        <rect x="592" y="588" width="522" height="108" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="616" y="638" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="616" dy="0">校验失败</tspan></text>
    <text x="616" y="680" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="616" dy="0">步骤标记 blocked，记录失败原因；Agent 必须回原文件补</tspan><tspan x="616" dy="26">齐后重新 complete。</tspan></text>
        <path d="M 850 444 L 850 540 M 845 531.3397459621556 L 850 540 L 855 531.3397459621556" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 850 540 L 826 588 M 825.4008473912079 578.0179653300854 L 826 588 L 834.345119301207 582.490101285085" fill="none" stroke="#A54E3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 744 696 L 744 794 M 739 785.3397459621556 L 744 794 L 749 785.3397459621556" fill="none" stroke="#8E744A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 744 794 L 456 794 M 464.66025403784437 789 L 456 794 L 464.66025403784437 799" fill="none" stroke="#8E744A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 456 794 L 456 700 M 461 708.6602540378444 L 456 700 L 451 708.6602540378444" fill="none" stroke="#8E744A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="458" y="760" fill="#CFC5B4" font-size="22" font-weight="780" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="458" dy="0">blocked 后回到 artifact 补内容，再次 </tspan><tspan x="458" dy="30">complete</tspan></text>
      
</svg>