<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="980" fill="url(#paperWash)"/>
  <g opacity="0.14">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200M0 1200H1200M0 1320H1200" stroke="#2C3442"/>
    <path d="M120 0V980M240 0V980M360 0V980M480 0V980M600 0V980M720 0V980M840 0V980M960 0V980M1080 0V980" stroke="#2C3442"/>
  </g>
  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 05 · FIXES</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">修复前（红）→ 修复后（绿）</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">两个失败点都不复杂，但都直接提升了 Runner 的工程可靠性。</tspan></text>
  
        <rect x="58" y="296" width="512" height="520" rx="28" fill="rgba(21,25,34,0.94)" stroke="#A54E3D" stroke-width="2.2" opacity="1"/>
        <text x="86" y="354" fill="#F5F1E8" font-size="34" font-weight="920" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="86" dy="0">修复前</tspan></text>
        <rect x="86" y="408" width="456" height="132" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="110" y="458" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">同秒冲突</tspan></text>
    <text x="110" y="500" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">run_id 只到秒级，连续 start 同名任务会撞目录</tspan><tspan x="110" dy="26">。</tspan></text>
        <rect x="86" y="578" width="456" height="132" rx="22" fill="#151922" stroke="#D4B06A" stroke-width="2.1" opacity="1"/>
    <text x="110" y="628" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">重复 step id 未校验</tspan></text>
    <text x="110" y="670" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">坏配置也能 start 成功，门禁根基不稳。</tspan></text>
        <rect x="86" y="748" width="456" height="60" rx="22" fill="#151922" stroke="#8E744A" stroke-width="2.1" opacity="1"/>
    <text x="110" y="798" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">结果</tspan></text>
    <text x="110" y="840" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="110" dy="0">边界场景会让流程状态失真。</tspan></text>

        <rect x="630" y="296" width="512" height="520" rx="28" fill="rgba(21,25,34,0.94)" stroke="#4FA36B" stroke-width="2.2" opacity="1"/>
        <text x="658" y="354" fill="#F5F1E8" font-size="34" font-weight="920" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="658" dy="0">修复后</tspan></text>
        <rect x="658" y="408" width="456" height="132" rx="22" fill="#151922" stroke="#4FA36B" stroke-width="2.1" opacity="1"/>
    <text x="682" y="458" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="682" dy="0">时间戳加微秒</tspan></text>
    <text x="682" y="500" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="682" dy="0">快速重复 start 仍然生成不同 run_id，不再撞目</tspan><tspan x="682" dy="26">录。</tspan></text>
        <rect x="658" y="578" width="456" height="132" rx="22" fill="#151922" stroke="#5C8D89" stroke-width="2.1" opacity="1"/>
    <text x="682" y="628" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="682" dy="0">配置加载做唯一性校验</tspan></text>
    <text x="682" y="670" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="682" dy="0">重复 step id 直接报错退出，问题留在 start 阶</tspan><tspan x="682" dy="26">段暴露。</tspan></text>
        <rect x="658" y="748" width="456" height="60" rx="22" fill="#151922" stroke="#6D7C57" stroke-width="2.1" opacity="1"/>
    <text x="682" y="798" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="682" dy="0">结果</tspan></text>
    <text x="682" y="840" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="682" dy="0">失败点被纳入固定回归冒烟项。</tspan></text>
      
</svg>