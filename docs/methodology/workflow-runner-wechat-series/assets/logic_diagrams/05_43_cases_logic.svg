<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080">
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="1080" fill="url(#paperWash)"/>
  <g opacity="0.14">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200M0 1200H1200M0 1320H1200" stroke="#2C3442"/>
    <path d="M120 0V1080M240 0V1080M360 0V1080M480 0V1080M600 0V1080M720 0V1080M840 0V1080M960 0V1080M1080 0V1080" stroke="#2C3442"/>
  </g>
  <text x="58" y="74" fill="#8E744A" font-size="21" font-weight="850" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">PART 05 · VALIDATION</tspan></text>
  <text x="58" y="138" fill="#F5F1E8" font-size="52" font-weight="920" text-anchor="start" font-family="PingFang SC, STSong, Songti SC, serif" letter-spacing="0"><tspan x="58" dy="0">43 / 2 / 1：验证闭环</tspan></text>
  <text x="58" y="224" fill="#CFC5B4" font-size="24" font-weight="560" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="58" dy="0">不是没翻车，而是翻车后补上了，这才让方案从设计变成工程。</tspan></text>
  
        <rect x="58" y="286" width="1084" height="200" rx="26" fill="rgba(21,25,34,0.92)" stroke="#2E3746" stroke-width="2" opacity="1"/>
        <text x="136" y="410" fill="#F5F1E8" font-size="112" font-weight="920" text-anchor="start" font-family="Georgia, serif" letter-spacing="0"><tspan x="136" dy="0">43</tspan></text>
        <text x="136" y="456" fill="#CFC5B4" font-size="28" font-weight="800" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="136" dy="0">总用例</tspan></text>
        <text x="494" y="410" fill="#A54E3D" font-size="112" font-weight="920" text-anchor="start" font-family="Georgia, serif" letter-spacing="0"><tspan x="494" dy="0">2</tspan></text>
        <text x="494" y="456" fill="#CFC5B4" font-size="28" font-weight="800" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="494" dy="0">失败点</tspan></text>
        <text x="820" y="410" fill="#4FA36B" font-size="112" font-weight="920" text-anchor="start" font-family="Georgia, serif" letter-spacing="0"><tspan x="820" dy="0">1</tspan></text>
        <text x="820" y="456" fill="#CFC5B4" font-size="28" font-weight="800" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="820" dy="0">次复测闭环</tspan></text>

        <rect x="58" y="568" width="520" height="194" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="82" y="618" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">失败 01 · 同秒冲突</tspan></text>
    <text x="82" y="660" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">run_id 只精确到秒，连续快速 start 同名需求时，第二次</tspan><tspan x="82" dy="26">直接撞上第一次。</tspan></text>
        <rect x="622" y="568" width="520" height="194" rx="22" fill="#151922" stroke="#A54E3D" stroke-width="2.1" opacity="1"/>
    <text x="646" y="618" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="646" dy="0">失败 02 · 配置缺陷未拦住</tspan></text>
    <text x="646" y="660" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="646" dy="0">重复 step id 的 YAML 配置仍能创建 run，说明门禁前的</tspan><tspan x="646" dy="26">元规则校验不够。</tspan></text>
        <rect x="58" y="824" width="1084" height="198" rx="22" fill="#151922" stroke="#4FA36B" stroke-width="2.1" opacity="1"/>
    <text x="82" y="874" fill="#F5F1E8" font-size="24" font-weight="900" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">从红到绿</tspan></text>
    <text x="82" y="916" fill="#CFC5B4" font-size="17" font-weight="500" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" letter-spacing="0"><tspan x="82" dy="0">加入微秒精度，补上重复 step id 唯一性校验。再跑一遍：两个失败点全部复测通过。可信度不来自 100% 全过，而来自“有失败、</tspan><tspan x="82" dy="26">有修复、有复测”的闭环。</tspan></text>
      
</svg>