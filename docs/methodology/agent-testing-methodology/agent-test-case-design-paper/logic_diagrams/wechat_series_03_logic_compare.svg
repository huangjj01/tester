<svg width="900" height="900" viewBox="0 0 900 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cmpbgSquare" x1="60" y1="40" x2="840" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B111C"/>
      <stop offset="1" stop-color="#09121E"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" rx="28" fill="url(#cmpbgSquare)"/>
  <text x="56" y="84" fill="#F7F4EA" font-size="40" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">弱断言 vs 有效断言</text>
  <text x="56" y="126" fill="#D4DCE5" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">不是“系统有响应”，而是“业务事实被证明”</text>

  <rect x="56" y="176" width="360" height="540" rx="24" fill="#151421" stroke="#72414B" stroke-width="2"/>
  <rect x="484" y="176" width="360" height="540" rx="24" fill="#111A28" stroke="#5B7B8E" stroke-width="2"/>
  <text x="88" y="226" fill="#F4B8C0" font-size="30" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">弱断言</text>
  <text x="516" y="226" fill="#A8ECF8" font-size="30" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">有效断言</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="88" y="304" fill="#F7F4EA" font-size="22">“验证订单处理成功”</text>
    <text x="88" y="350" fill="#F7F4EA" font-size="22">“系统返回正确结果”</text>
    <text x="88" y="396" fill="#F7F4EA" font-size="22">“ordStatus=0”</text>
    <text x="88" y="488" fill="#D5B7BD" font-size="20">问题：只证明“有响应”</text>
    <text x="88" y="522" fill="#D5B7BD" font-size="20">没有证明业务语义</text>
    <text x="88" y="556" fill="#D5B7BD" font-size="20">容易制造“假通过”</text>

    <text x="516" y="304" fill="#F7F4EA" font-size="22">先写测试意图</text>
    <text x="516" y="338" fill="#CAD4DE" font-size="20">要证明什么业务事实？</text>
    <text x="516" y="392" fill="#F7F4EA" font-size="22">再写必须断言</text>
    <text x="516" y="426" fill="#CAD4DE" font-size="20">状态、原因、链路证据是否一致？</text>
    <text x="516" y="480" fill="#F7F4EA" font-size="22">最后补输入和步骤</text>
    <text x="516" y="560" fill="#A8ECF8" font-size="20">结果：断言自然会变具体</text>
  </g>

  <path d="M416 450H484" stroke="#E3C979" stroke-width="4"/>
  <path d="M466 432L484 450L466 468" stroke="#E3C979" stroke-width="4"/>

  <rect x="56" y="772" width="788" height="52" rx="14" fill="#0F1725" stroke="#31475D"/>
  <text x="82" y="805" fill="#D5DEE8" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">一句断言如果能无缝替换进很多条 case 里，通常就太弱了。</text>
</svg>
