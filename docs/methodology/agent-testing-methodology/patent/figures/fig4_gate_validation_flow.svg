<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570">
<title>图4 门禁校验流程图</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker><style><![CDATA[text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#111;font-size:14px}.title{font-size:20px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.6}.dash{fill:#fff;stroke:#111;stroke-width:1.5;stroke-dasharray:6 4}.line{stroke:#111;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.small{font-size:12px}.bold{font-weight:700}]]></style></defs>
<rect x="0" y="0" width="760" height="570" fill="#fff"/>
<text class="title" x="380" y="32" text-anchor="middle">图4 门禁校验流程图</text>
<rect class="box" x="250" y="70" width="260" height="55"/>
<text x="380" y="102.5" text-anchor="middle">完成命令触发</text>
<path class="line" d="M380,125 L380,160"/>
<rect class="box" x="250" y="160" width="260" height="55"/>
<text x="380" y="192.5" text-anchor="middle">步骤1：依赖校验</text>
<path class="line" d="M380,215 L380,250"/>
<rect class="box" x="250" y="250" width="260" height="55"/>
<text x="380" y="282.5" text-anchor="middle">步骤2：产物文件存在性检查</text>
<path class="line" d="M380,305 L380,340"/>
<rect class="box" x="250" y="340" width="260" height="55"/>
<text x="380" y="364" text-anchor="middle">步骤3：内容校验</text>
<text x="380" y="381" text-anchor="middle">标题校验或表格校验</text>
<path class="line" d="M380,395 L380,430"/>
<rect class="box" x="250" y="430" width="260" height="55"/>
<text x="380" y="454" text-anchor="middle">步骤4：状态更新</text>
<text x="380" y="471" text-anchor="middle">completed/blocked</text>
<rect class="dash" x="55" y="160" width="150" height="55"/>
<text x="130" y="184" text-anchor="middle">依赖未满足</text>
<text x="130" y="201" text-anchor="middle">退出码 1</text>
<rect class="dash" x="55" y="250" width="150" height="55"/>
<text x="130" y="274" text-anchor="middle">产物不存在</text>
<text x="130" y="291" text-anchor="middle">退出码 2</text>
<rect class="dash" x="55" y="340" width="150" height="75"/>
<text x="130" y="365.5" text-anchor="middle">校验失败</text>
<text x="130" y="382.5" text-anchor="middle">记录 validation_errors</text>
<text x="130" y="399.5" text-anchor="middle">状态 blocked</text>
<path class="line" d="M250,187 L205,187"/>
<path class="line" d="M250,277 L205,277"/>
<path class="line" d="M250,367 L205,367"/>

</svg>
