<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <title>图3 步骤状态转换图</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <style><![CDATA[
      text { font-family: Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#111; font-size:14px; }
      .title { font-size:20px; font-weight:700; }
      .box { fill:#fff; stroke:#111; stroke-width:1.6; }
      .dash { fill:#fff; stroke:#111; stroke-width:1.5; stroke-dasharray:6 4; }
      .line { stroke:#111; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .plain { stroke:#111; stroke-width:1.5; fill:none; }
      .small { font-size:12px; }
      .bold { font-weight:700; }
    ]]></style>
  </defs>
  <rect x="0" y="0" width="720" height="560" fill="#fff"/>
  <text class="title" x="360" y="32" text-anchor="middle">图3 步骤状态转换图</text>
  <rect class="box" x="270" y="70" width="160" height="55" rx="0"/>
  <text x="350" y="94" text-anchor="middle">pending</text>
  <text x="350" y="111" text-anchor="middle">等待执行</text>
  <rect class="box" x="270" y="185" width="160" height="55" rx="0"/>
  <text x="350" y="217.5" text-anchor="middle">执行校验</text>
  <rect class="dash" x="80" y="320" width="160" height="55" rx="0"/>
  <text x="160" y="344" text-anchor="middle">blocked</text>
  <text x="160" y="361" text-anchor="middle">已阻塞</text>
  <rect class="box" x="470" y="320" width="160" height="55" rx="0"/>
  <text x="550" y="344" text-anchor="middle">completed</text>
  <text x="550" y="361" text-anchor="middle">已完成</text>
  <rect class="box" x="470" y="455" width="160" height="55" rx="0"/>
  <text x="550" y="479" text-anchor="middle">下一 pending</text>
  <text x="550" y="496" text-anchor="middle">步骤</text>
  <rect class="dash" x="80" y="455" width="160" height="55" rx="0"/>
  <text x="160" y="479" text-anchor="middle">not_required_yet</text>
  <text x="160" y="496" text-anchor="middle">目标不要求</text>
  <path class="line" d="M350,125 L350,185"/>
  <path class="line" d="M270,212 L160,320"/>
  <path class="line" d="M430,212 L550,320"/>
  <path class="line" d="M160,375 L270,212"/>
  <path class="line" d="M550,375 L550,455"/>
  <text class="small" x="236" y="273" text-anchor="middle">校验失败</text>
  <text class="small" x="460" y="273" text-anchor="middle">校验通过</text>
  <text class="small" x="180" y="420" text-anchor="middle">修复后重新校验</text>

</svg>
