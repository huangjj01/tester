<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590">
  <title>图2 门禁校验步骤流程图</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <style><![CDATA[
      text { font-family: Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#111; font-size:14px; }
      .title { font-size:20px; font-weight:700; }
      .box { fill:#fff; stroke:#111; stroke-width:1.6; }
      .dash { fill:#fff; stroke:#111; stroke-width:1.5; stroke-dasharray:6 4; }
      .line { stroke:#111; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .plain { stroke:#111; stroke-width:1.5; fill:none; }
      .small { font-size:12px; }
      .bold { font-weight:700; }
    ]]></style>
  </defs>
  <rect x="0" y="0" width="720" height="590" fill="#fff"/>
  <text class="title" x="360" y="32" text-anchor="middle">图2 门禁校验步骤流程图</text>
  <rect class="box" x="230" y="70" width="240" height="55" rx="0"/>
  <text x="350" y="102.5" text-anchor="middle">接收 complete 指令</text>
  <path class="line" d="M350,125 L350,165"/>
  <rect class="box" x="230" y="165" width="240" height="55" rx="0"/>
  <text x="350" y="197.5" text-anchor="middle">依赖校验</text>
  <path class="line" d="M350,220 L350,260"/>
  <rect class="box" x="230" y="260" width="240" height="55" rx="0"/>
  <text x="350" y="292.5" text-anchor="middle">产物文件存在性校验</text>
  <path class="line" d="M350,315 L350,355"/>
  <rect class="box" x="230" y="355" width="240" height="55" rx="0"/>
  <text x="350" y="387.5" text-anchor="middle">产物内容校验</text>
  <path class="line" d="M350,410 L350,450"/>
  <rect class="box" x="230" y="450" width="240" height="55" rx="0"/>
  <text x="350" y="482.5" text-anchor="middle">更新状态</text>
  <rect class="dash" x="55" y="170" width="130" height="48" rx="0"/>
  <text x="120" y="190.5" text-anchor="middle">依赖未满足</text>
  <text x="120" y="207.5" text-anchor="middle">返回错误</text>
  <path class="line" d="M230,192 L185,192"/>
  <rect class="dash" x="55" y="265" width="130" height="48" rx="0"/>
  <text x="120" y="285.5" text-anchor="middle">产物缺失</text>
  <text x="120" y="302.5" text-anchor="middle">状态 blocked</text>
  <path class="line" d="M230,287 L185,287"/>
  <rect class="dash" x="55" y="360" width="130" height="70" rx="0"/>
  <text x="120" y="383" text-anchor="middle">标题/表格</text>
  <text x="120" y="400" text-anchor="middle">有效数据失败</text>
  <text x="120" y="417" text-anchor="middle">状态 blocked</text>
  <path class="line" d="M230,382 L185,382"/>
  <rect class="box" x="535" y="452" width="130" height="56" rx="0"/>
  <text x="600" y="468" text-anchor="middle">通过</text>
  <text x="600" y="485" text-anchor="middle">completed</text>
  <text x="600" y="502" text-anchor="middle">推进下一步</text>
  <path class="line" d="M470,477 L535,477"/>

</svg>
