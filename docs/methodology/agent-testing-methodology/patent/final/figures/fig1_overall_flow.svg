<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660">
  <title>图1 方法总体流程图</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <style><![CDATA[
      text { font-family: Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#111; font-size:14px; }
      .title { font-size:20px; font-weight:700; }
      .box { fill:#fff; stroke:#111; stroke-width:1.6; }
      .dash { fill:#fff; stroke:#111; stroke-width:1.5; stroke-dasharray:6 4; }
      .line { stroke:#111; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .plain { stroke:#111; stroke-width:1.5; fill:none; }
      .small { font-size:12px; }
      .bold { font-weight:700; }
    ]]></style>
  </defs>
  <rect x="0" y="0" width="700" height="660" fill="#fff"/>
  <text class="title" x="350" y="32" text-anchor="middle">图1 方法总体流程图</text>
  <rect class="box" x="80" y="65" width="190" height="55" rx="0"/>
  <text x="175" y="97.5" text-anchor="middle">读取工作流配置数据</text>
  <path class="line" d="M175,120 L175,148"/>
  <rect class="box" x="80" y="148" width="190" height="55" rx="0"/>
  <text x="175" y="172" text-anchor="middle">创建运行实例</text>
  <text x="175" y="189" text-anchor="middle">生成唯一运行标识</text>
  <path class="line" d="M175,203 L175,231"/>
  <rect class="box" x="80" y="231" width="190" height="55" rx="0"/>
  <text x="175" y="255" text-anchor="middle">确定目标产物</text>
  <text x="175" y="272" text-anchor="middle">与必经步骤集合</text>
  <path class="line" d="M175,286 L175,314"/>
  <rect class="box" x="80" y="314" width="190" height="55" rx="0"/>
  <text x="175" y="338" text-anchor="middle">输出当前步骤</text>
  <text x="175" y="355" text-anchor="middle">产物路径与校验要求</text>
  <path class="line" d="M175,369 L175,397"/>
  <rect class="box" x="80" y="397" width="190" height="55" rx="0"/>
  <text x="175" y="429.5" text-anchor="middle">执行门禁校验</text>
  <path class="line" d="M175,452 L175,480"/>
  <rect class="box" x="80" y="480" width="190" height="55" rx="0"/>
  <text x="175" y="512.5" text-anchor="middle">状态更新与持久化</text>
  <path class="line" d="M175,535 L175,563"/>
  <rect class="box" x="80" y="563" width="190" height="55" rx="0"/>
  <text x="175" y="595.5" text-anchor="middle">中断后按状态恢复</text>
  <rect class="box" x="360" y="65" width="230" height="55" rx="0"/>
  <text x="475" y="89" text-anchor="middle">AI Agent</text>
  <text x="475" y="106" text-anchor="middle">测试实施请求</text>
  <path class="line" d="M360,92 L270,92"/>
  <rect class="dash" x="360" y="230" width="230" height="75" rx="0"/>
  <text x="475" y="255.5" text-anchor="middle">校验失败：</text>
  <text x="475" y="272.5" text-anchor="middle">写入 blocked 状态</text>
  <text x="475" y="289.5" text-anchor="middle">阻止后续推进</text>
  <path class="line" d="M270,312 L360,312"/>
  <rect class="box" x="360" y="365" width="230" height="75" rx="0"/>
  <text x="475" y="390.5" text-anchor="middle">校验通过：</text>
  <text x="475" y="407.5" text-anchor="middle">写入 completed 状态</text>
  <text x="475" y="424.5" text-anchor="middle">推进下一步骤</text>
  <path class="line" d="M270,395 L360,395"/>

</svg>
