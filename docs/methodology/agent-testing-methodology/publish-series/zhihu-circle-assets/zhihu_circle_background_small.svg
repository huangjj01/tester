<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061421"/>
      <stop offset="0.56" stop-color="#10314E"/>
      <stop offset="1" stop-color="#DCEFFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="241" x2="450" y2="241" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#BDEAFF" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="58" y="40" width="524" height="266" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001424" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <g opacity="0.45">
    <rect x="24" y="54" width="150" height="8" fill="#88CFFF" fill-opacity="0.16"/>
    <rect x="24" y="78" width="118" height="6" fill="#88CFFF" fill-opacity="0.12"/>
    <rect x="24" y="102" width="180" height="6" fill="#88CFFF" fill-opacity="0.12"/>
    <rect x="470" y="62" width="136" height="8" fill="#FFFFFF" fill-opacity="0.13"/>
    <rect x="500" y="88" width="92" height="6" fill="#FFFFFF" fill-opacity="0.1"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="58" width="484" height="230" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>

  <rect x="112" y="86" width="116" height="28" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="130" y="105" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#EAF9FF">AI测试实战圈</text>

  <text x="320" y="160" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">测试人，用 AI 重写质量能力</text>
  <text x="320" y="194" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#D8EEFF">方法论 · 工具落地 · 自动化实践 · 项目复盘</text>

  <g transform="translate(144 226)">
    <rect width="86" height="28" fill="#1677FF"/>
    <text x="19" y="19" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">需求分析</text>
    <path d="M100 14H130" stroke="#DDF5FF" stroke-opacity="0.62" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="144" width="86" height="28" fill="#0EA5E9"/>
    <text x="163" y="19" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">用例设计</text>
    <path d="M244 14H274" stroke="#DDF5FF" stroke-opacity="0.62" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="288" width="86" height="28" fill="#00B8A9"/>
    <text x="307" y="19" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">质量复盘</text>
  </g>

  <g transform="translate(462 115)">
    <circle cx="48" cy="48" r="44" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="48" cy="48" r="29" fill="#071421" fill-opacity="0.62" stroke="#7FD8FF" stroke-opacity="0.38"/>
    <path d="M32 47L44 59L65 34" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
