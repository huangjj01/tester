    <text x="28" y="28" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#E7F9FF">目标：把零散经验变成可检索、可讨论、可复用的 AI 测试知识库。</text>
