  <text x="142" y="142" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">内容运营方向</text>
  <text x="142" y="190" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="500" fill="#CFE7F4">公众号「德彪谈测试」持续输出，圈子沉淀可讨论、可复用、可落地的内容。</text>

  <g transform="translate(142 252)">
    <rect width="258" height="234" rx="22" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
