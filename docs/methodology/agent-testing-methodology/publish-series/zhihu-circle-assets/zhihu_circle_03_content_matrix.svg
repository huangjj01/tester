    <text x="28" y="126" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">方法论拆解</text>
    <text x="28" y="166" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#CFE7F4">AI 怎么辅助需求分析、</text>
    <text x="28" y="198" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#CFE7F4">用例设计和质量评估。</text>
  </g>

  <g transform="translate(471 252)">
    <rect width="258" height="234" rx="22" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="28" y="28" width="62" height="62" rx="18" fill="#1677FF"/>
    <path d="M45 54H73" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 72H64" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <text x="28" y="126" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">项目实战复盘</text>
    <text x="28" y="166" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#CFE7F4">真实项目里的问题、</text>
    <text x="28" y="198" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#CFE7F4">证据链和踩坑经验。</text>
  </g>

  <g transform="translate(800 252)">
    <rect width="258" height="234" rx="22" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="28" y="28" width="62" height="62" rx="18" fill="#F59E0B"/>
    <path d="M47 72L58 50L70 72" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="126" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">同行交流共创</text>
